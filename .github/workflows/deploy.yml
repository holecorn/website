name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browser checks run against the built app, so they come after the build.
      # Playwright is not a project dependency — it is a heavy install for
      # scripts that run occasionally, so CI adds it without touching the
      # lockfile and uses the bundled Chromium rather than a system Chrome.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Left on v3 while the others moved to the Node 24 runtime: this one is a
      # composite action with no runtime of its own, so it was never part of the
      # deprecation. v4 excludes dotfiles from the artifact, which buys nothing
      # here and is a behaviour change for no reason.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Gates the deploy even though the firmware does not ship with the app,
  # because they share a contract: glyphs.h is generated from src/segments.js,
  # and the payload shape in src/scoreboard.js is what board_logic.h parses. A
  # change to either can break a board in the field, and this is the only thing
  # that notices. Runs alongside `build`, so it costs no wall-clock.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # ArduinoJson is a vendored header rather than a dependency, so it is
      # gitignored and fetched on demand. Cached to keep a third party off the
      # critical path of a deploy.
      - uses: actions/cache@v6
        with:
          path: firmware/hub75/ArduinoJson.h
          key: arduinojson-v7.4.3
      - run: npm run test:firmware

  deploy:
    needs: [build, firmware]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
