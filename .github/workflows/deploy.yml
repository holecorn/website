name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned rather than tracking latest, so the browser cache key is stable and a
  # Playwright release cannot break a deploy on its own. Keep in step with what
  # `npm install --no-save playwright` gives you locally.
  PLAYWRIGHT_VERSION: 1.62.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Browser checks run against the built app, so they come after the build.
      # Playwright is not a project dependency — it is a heavy install for
      # scripts that run occasionally, so CI adds it without touching the
      # lockfile and uses the bundled Chromium rather than a system Chrome.
      #
      # Pinned, which the cache below needs to have a stable key, and which also
      # stops an upstream Playwright release breaking a deploy with no change
      # here. Bump it deliberately; the browser cache re-fills on the first run.
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@${{ env.PLAYWRIGHT_VERSION }}
      # Saves the ~13s Chromium download. Keyed on the pinned version because the
      # browsers live in a version-stamped directory — a stale entry would be
      # ignored and silently re-downloaded, so the key must move when the pin does.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # `--with-deps` is kept on a cache hit, and deliberately: it is ~19s of apt,
      # but part of what it installs is fonts, and verify-lanes.mjs asserts exact
      # pixel widths that depend on how `system-ui` resolves. Dropping it to save
      # the apt time risks moving those metrics, which is a worse trade than 19s.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # v5 rather than v3 or v4: this is a composite action, so it has no runtime
      # of its own, but it *calls* actions/upload-artifact — v3 and v4 both pin a
      # v4.x of that, which is node20, and the run annotates the Node 20
      # deprecation because of it. Only v5 (upload-artifact v7, node24) clears it.
      #
      # v5 excludes dotfiles from the artifact unless include-hidden-files is set.
      # Checked rather than assumed: dist/ has none, and CNAME is not one, so the
      # custom domain is unaffected.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Gates the deploy even though the firmware does not ship with the app,
  # because they share a contract: glyphs.h is generated from src/segments.js,
  # and the payload shape in src/scoreboard.js is what board_logic.h parses. A
  # change to either can break a board in the field, and this is the only thing
  # that notices. Runs alongside `build`, so it costs no wall-clock.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # ArduinoJson is a vendored header rather than a dependency, so it is
      # gitignored and fetched on demand. Cached to keep a third party off the
      # critical path of a deploy.
      - uses: actions/cache@v6
        with:
          path: firmware/hub75/host/ArduinoJson.h
          key: arduinojson-v7.4.3
      - run: npm run test:firmware

  deploy:
    needs: [build, firmware]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
